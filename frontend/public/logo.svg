<svg width="750" height="200" viewBox="0 0 750 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand Emblem (B + Circuit Mortarboard) -->
  <g transform="translate(10, 10)">
    <!-- Main Outer B Shape -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 0 0 H 95 C 135 0 162 25 162 62 C 162 85 146 103 124 112 C 150 120 170 140 170 172 C 170 208 138 230 95 230 H 0 V 0 Z M 48 38 H 82 C 96 38 108 47 108 60 C 108 73 96 82 82 82 H 48 V 38 Z M 48 126 H 86 C 102 126 114 136 114 150 C 114 164 102 174 86 174 H 48 V 126 Z" fill="#0047AB" transform="scale(0.78)"/>
    
    <!-- Cutout details inside B (White emblem) -->
    <!-- Mortarboard Cap -->
    <path d="M 64 22 L 32 38 L 64 54 L 96 38 Z" fill="#FFFFFF"/>
    <path d="M 44 45.5 V 53 C 44 58 84 58 84 53 V 45.5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Vertical Circuit Stem -->
    <rect x="61" y="54" width="6" height="84" rx="3" fill="#FFFFFF"/>
    
    <!-- Top Left Node -->
    <path d="M 64 72 H 45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="41" cy="72" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>
    
    <!-- Top Right Node -->
    <path d="M 64 72 H 83" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="87" cy="72" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>
    
    <!-- Mid Left Node -->
    <path d="M 64 96 H 38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="34" cy="96" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>
    
    <!-- Mid Right Node -->
    <path d="M 64 96 H 90" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="94" cy="96" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>

    <!-- Bottom Left Node -->
    <path d="M 64 120 H 48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="120" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>

    <!-- Bottom Right Node -->
    <path d="M 64 120 H 80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="84" cy="120" r="5" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>

    <!-- Bottom Concentric Ring Node -->
    <circle cx="64" cy="142" r="7" stroke="#FFFFFF" stroke-width="3" fill="#0047AB"/>
    <circle cx="64" cy="142" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <!-- BLAZE Text -->
  <text x="175" y="102" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="88" fill="#0047AB" letter-spacing="3">BLAZE</text>
  
  <!-- TECH SOLUTIONS Text -->
  <text x="178" y="155" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#0047AB" letter-spacing="10.5">TECH SOLUTIONS</text>
</svg>
